[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
editor-core = { path = "crates/editor-core" }
godot-project = { path = "crates/godot-project" }
lsp-client = { path = "crates/lsp-client" }
terminal = { path = "crates/terminal" }
theme = { path = "crates/theme" }

iced = { version = "0.14", features = ["advanced"] }
rfd = "0.15"
ropey = "1.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
alacritty_terminal = "0.25"
notify = "8"
windows-sys = "0.59"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds responsive: the UI stack is slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
