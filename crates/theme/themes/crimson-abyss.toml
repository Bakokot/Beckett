# Crimson Night's high-contrast sibling: almost black, wine borders,
# near-white text and vivid colors.
name = "Crimson Abyss"
author = "Beckett"
kind = "dark"

[ui]
background = "#0a0507"
surface = "#130b0c"
text = "#f7f0f1"
text_muted = "#b9a9ae"
accent = "#ff3a56"
border = "#3f071a"
success = "#3dff8f"
warning = "#ffcc3d"
danger = "#ff5c72"

[syntax]
text = "#f7f0f1"
keyword = "#ff5c78"
control_flow = "#ff8250"
type = "#ffc35f"
function = "#ff9f8c"
annotation = "#ff8f3a"
string = "#c9f27a"
string_name = "#ffd67a"
node_path = "#6ef2b6"
number = "#ff8fca"
comment = "#9b8b90"
constant = "#ffb6c0"
symbol = "#f2dade"

[terminal]
black = "#1e0a12"
red = "#ff3355"
green = "#5cff9d"
yellow = "#ffd166"
blue = "#5cb8ff"
magenta = "#ff6ec7"
cyan = "#4ff2d8"
white = "#f7f0f1"
bright_black = "#6e293d"
bright_red = "#ff6b84"
bright_green = "#9dffc4"
bright_yellow = "#ffe39e"
bright_blue = "#9cd4ff"
bright_magenta = "#ffa6dd"
bright_cyan = "#9ef9ea"
bright_white = "#ffffff"
