# A near-black theme with crimson accents.
name = "Crimson Night"
author = "Beckett"
kind = "dark"

[ui]
background = "#161518"
surface = "#1e1c21"
text = "#ddd7d8"
text_muted = "#8e8689"
accent = "#e0313f"
border = "#0d0c0f"
success = "#5fc98a"
warning = "#e9b35c"
danger = "#ff5f73"

[syntax]
text = "#ddd7d8"
keyword = "#ff4f5e"
control_flow = "#ff8566"
type = "#f2b77e"
function = "#ffb2a0"
annotation = "#ff9d5c"
string = "#b9d08f"
string_name = "#d9c48f"
node_path = "#9fd0b3"
number = "#eda3c1"
comment = "#7d7477"
constant = "#f5a3aa"
symbol = "#c9b8bb"

[terminal]
black = "#2a272d"
red = "#ff4f5e"
green = "#7fcf8f"
yellow = "#e9c46a"
blue = "#7aa6da"
magenta = "#e58fb6"
cyan = "#7fc8c2"
white = "#ddd7d8"
bright_black = "#5c565b"
bright_red = "#ff7b86"
bright_green = "#a8e6b4"
bright_yellow = "#f5d98e"
bright_blue = "#a3c4ec"
bright_magenta = "#f2b3cf"
bright_cyan = "#a6e0db"
bright_white = "#ffffff"
