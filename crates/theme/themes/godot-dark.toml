# Matches the default Godot 4 editor theme.
name = "Godot Dark"
author = "Godot IDE"
kind = "dark"

[ui]
background = "#1d2229"
surface = "#262c3b"
text = "#cdcfd2"
text_muted = "#8a8f98"
accent = "#478cbf"
border = "#14171c"
success = "#45ff8b"
warning = "#ffdd65"
danger = "#ff5d5d"

[syntax]
text = "#cdcfd2"
keyword = "#ff7085"
control_flow = "#ff8ccc"
type = "#42ffc2"
function = "#57b3ff"
annotation = "#ffb373"
string = "#ffeda1"
string_name = "#ffc2a6"
node_path = "#b8c47d"
number = "#a1ffe0"
comment = "#cdcfd280"
constant = "#bce0ff"
symbol = "#abc9ff"

[terminal]
black = "#4c566a"
red = "#ff7085"
green = "#8eef97"
yellow = "#ffeda1"
blue = "#57b3ff"
magenta = "#ff8ccc"
cyan = "#42ffc2"
white = "#cdcfd2"
bright_black = "#6b717c"
bright_red = "#ff9ab0"
bright_green = "#b6ffbe"
bright_yellow = "#fff4c4"
bright_blue = "#8fd0ff"
bright_magenta = "#ffb3e0"
bright_cyan = "#8fffdb"
bright_white = "#ffffff"
